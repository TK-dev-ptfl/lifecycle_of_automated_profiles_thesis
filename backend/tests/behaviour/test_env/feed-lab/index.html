<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F0F6; --surface:#FFFFFF; --raise:#F7F6FB; --ink:#1D1B2B; --muted:#6A6782; --line:#E2E0EC;
  --accent:#5B3FD9; --accent-ink:#FFFFFF; --like:#D9245A; --ok:#22845A; --warn:#A06210; --bad:#C2302B;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121119; --surface:#1B1A25; --raise:#22212E; --ink:#ECEAF5; --muted:#A09DB8; --line:#2E2C3D;
    --accent:#9B87FF; --accent-ink:#14121F; --like:#FF6B94; --ok:#5CC491; --warn:#E5AA55; --bad:#FF7A70;
  }
}
:root[data-theme="dark"]{
  --paper:#121119; --surface:#1B1A25; --raise:#22212E; --ink:#ECEAF5; --muted:#A09DB8; --line:#2E2C3D;
  --accent:#9B87FF; --accent-ink:#14121F; --like:#FF6B94; --ok:#5CC491; --warn:#E5AA55; --bad:#FF7A70;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grecaptcha-badge{visibility:hidden}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;height:60px;display:flex;align-items:center;gap:20px;padding:0 20px}
.brand{font:800 1.6rem/1 var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.search{flex:1;max-width:420px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.me{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:var(--accent-ink);border:none}

/* Layout */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,600px) minmax(0,300px);gap:32px;padding:24px 20px 120px;justify-content:center}
.nav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;padding:10px 14px;border:none;background:none;border-radius:12px;font-weight:600;font-size:1.02rem;text-align:left}
.nav button:hover{background:var(--surface)}
.nav button[aria-current]{background:var(--surface);color:var(--accent)}
.nav svg{width:22px;height:22px}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font:700 1.15rem/1.2 var(--display);margin:0 0 12px}
.trend{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 0;border-top:1px solid var(--line)}
.trend:first-of-type{border-top:none}
.trend b{display:block}
.trend span{color:var(--muted);font-size:.85rem}
.who{display:flex;align-items:center;gap:10px;padding:8px 0}
.who div{flex:1;min-width:0}
.who b,.who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-size:.85rem}

/* Composer & posts */
.composer{display:flex;gap:12px}
.composer textarea{flex:1;min-height:56px;resize:vertical;border:none;background:transparent;font-size:1.05rem;padding:8px 0}
.composer textarea:focus-visible{outline:none}
.composer-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.pill{border:none;border-radius:999px;padding:8px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.pill.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.pill[aria-pressed="true"]{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.feed{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 8px}
.post.new{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
.ph{display:flex;align-items:center;gap:10px}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#fff;background:hsl(var(--h) 55% 48%)}
.ph .who-line{flex:1;min-width:0;line-height:1.25}
.ph .who-line b{font-weight:700}
.ph .who-line span{color:var(--muted);font-size:.9rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{border:none;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--raise);color:var(--ink)}
.icon svg{width:20px;height:20px}
.post .text{margin:10px 0 12px;font-size:1.02rem;white-space:pre-wrap;overflow-wrap:anywhere}
.media{aspect-ratio:16/10;border-radius:14px;margin-bottom:10px;border:1px solid var(--line)}
.acts{display:flex;justify-content:space-between;max-width:440px;margin-left:-8px}
.act{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);padding:8px;border-radius:999px;font-size:.9rem;font-variant-numeric:tabular-nums}
.act svg{width:19px;height:19px}
.act:hover{background:var(--raise);color:var(--ink)}
.act.like[aria-pressed="true"]{color:var(--like)}
.act.like[aria-pressed="true"] svg path{fill:currentColor}
.act.rep[aria-pressed="true"]{color:var(--ok)}
.act.save[aria-pressed="true"]{color:var(--accent)}
.act.save[aria-pressed="true"] svg path{fill:currentColor}
.comments{border-top:1px solid var(--line);margin-top:6px;padding:10px 0 8px}
.cmt{display:flex;gap:10px;padding:6px 0}
.cmt .av{width:30px;height:30px;font-size:.75rem}
.cmt div{background:var(--raise);border-radius:14px;padding:6px 12px;min-width:0}
.cmt b{font-size:.88rem}
.cmt p{margin:0;font-size:.95rem;overflow-wrap:anywhere}
.reply{display:flex;gap:8px;margin-top:8px}
.reply input{flex:1;min-width:0;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:8px 14px}
.loading{text-align:center;color:var(--muted);padding:24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Session check widget */
.sc{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;width:320px;max-width:calc(100vw - 32px);
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px -12px rgba(20,16,50,.35);font-size:.88rem}
.sc-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.sc-title{flex:1;font:700 1rem/1.2 var(--display)}
.sc-title span{display:block;font:500 .8rem/1.3 var(--body);color:var(--muted)}
.sc-num{font:800 2rem/1 var(--display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.sc-body{padding:0 14px 12px;max-height:min(62vh,560px);overflow:auto;overscroll-behavior:contain}
.sc.min .sc-body{display:none}
.sc canvas{display:block;width:100%;height:34px;border-radius:8px;background:var(--raise);margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line)}
.row b{font-weight:600}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row .sub{grid-column:1 / 3;color:var(--muted);font-size:.8rem}
.meter{grid-column:1 / 3;height:5px;border-radius:3px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:currentColor;transition:width .4s}
.tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)} .tone-bad{color:var(--bad)} .tone-none{color:var(--muted)}
.sc-tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.sc-tools button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 10px;font-weight:600;font-size:.8rem}
.sc-tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.checks{list-style:none;margin:0;padding:0}
.chk{display:grid;grid-template-columns:8px 1fr auto;gap:2px 8px;padding:6px 0;border-top:1px solid var(--line)}
.chk .m{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--line)}
.chk .s{font-size:.75rem;font-weight:700;color:var(--muted)}
.chk p{grid-column:2 / 4;margin:0;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
.chk[data-s="pass"] .m{background:var(--ok)} .chk[data-s="pass"] .s{color:var(--ok)}
.chk[data-s="warn"] .m{background:var(--warn)} .chk[data-s="warn"] .s{color:var(--warn)}
.chk[data-s="fail"] .m{background:var(--bad)} .chk[data-s="fail"] .s{color:var(--bad)}
.legal{color:var(--muted);font-size:.72rem;margin:10px 0 0}
.legal a{color:inherit}

@media (max-width:1180px){.layout{grid-template-columns:200px minmax(0,600px)}.side{display:none}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr);padding:16px 12px 140px}.nav{display:none}.search{display:none}.me{margin-left:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg>Hearth</div>
    <input class="search" type="search" placeholder="Search Hearth" aria-label="Search">
    <button class="me" aria-label="Your profile">YO</button>
  </div>
</header>

<div class="layout">
  <nav class="nav" aria-label="Main">
    <button aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Explore</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>Notifications</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>Messages</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</button>
  </nav>

  <main>
    <section class="card" aria-label="New post">
      <div class="composer">
        <div class="av" style="--h:255">YO</div>
        <textarea id="composer" placeholder="What's warming you up today?" aria-label="Write a post"></textarea>
      </div>
      <div class="composer-foot"><button class="pill" id="postBtn">Post</button></div>
    </section>
    <div class="feed" id="feed" aria-live="off"></div>
    <div class="loading" id="sentinel">Loading more posts…</div>
  </main>

  <aside class="side">
    <section class="card"><h2>Trending</h2><div id="trends"></div></section>
    <section class="card"><h2>Who to follow</h2><div id="whoList"></div></section>
  </aside>
</div>

<div class="toast" id="toast" role="status"></div>

<aside class="sc" id="sc" aria-label="Session check">
  <div class="sc-head">
    <div class="sc-title">Session check<span id="scVerdict">Interact with the feed</span></div>
    <div class="sc-num tone-none" id="scNum">–</div>
    <button class="icon" id="scToggle" aria-expanded="true" aria-label="Collapse session check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="sc-body">
    <canvas id="spark" aria-label="Cursor speed, last 6 seconds"></canvas>
    <div class="row" id="rBeh"><b>Behaviour</b><span class="v">–</span><span class="meter"><i></i></span><span class="sub">Waiting for input</span></div>
    <div class="row" id="rFp"><b>Fingerprint consistency</b><span class="v">…</span><span class="meter"><i></i></span><span class="sub">Running checks</span></div>
    <div class="row" id="rRc"><b>reCAPTCHA v3</b><span class="v">–</span><span class="meter"><i></i></span><span class="sub">Starting</span></div>
    <div class="sc-tools" role="group" aria-label="Details">
      <button data-tab="beh" aria-pressed="false">Behaviour details</button>
      <button data-tab="fp" aria-pressed="false">Fingerprint details</button>
      <button id="rerun">Re-run services</button>
      <button id="copyRep">Copy report</button>
    </div>
    <ul class="checks" id="detail" hidden></ul>
    <p class="legal" id="legal" hidden>This site is protected by reCAPTCHA and the Google <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy Policy</a> and <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms of Service</a> apply.</p>
  </div>
</aside>

<script>
(() => {
'use strict';
/* ===== Configuration: server.mjs fills these in; placeholders mean "not configured" ===== */
const CFG = { recaptchaKey: '__RECAPTCHA_SITE_KEY__', verifyBase: '' };
const configured = k => !!k && !k.startsWith('__');

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const cv = a => a.length > 1 ? sd(a) / mean(a) : NaN;
const med = a => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const f2 = n => Number.isFinite(n) ? n.toFixed(2) : '–';
const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const LOADED = performance.now();

/* ===== Dummy feed ===== */
const FIRST = ['Maya','Tomás','Ines','Kofi','Lena','Arjun','Sofia','Noah','Yuki','Rita','Omar','Clara','Diego','Hana','Felix','Amara','Jonas','Leila','Marco','Priya','Elias','Zoe','Rui','Nadia'];
const LAST = ['Ferreira','Okafor','Lindqvist','Tanaka','Moreau','Kaur','Silva','Novak','Haddad','Brennan','Costa','Ito','Mendes','Varga','Adeyemi','Rossi'];
const POSTS = [
  'Finally fixed the squeaky door hinge that has been haunting me since March. Small victories.',
  'Hot take: the best part of any trip is the first coffee in a new city.',
  'Planted tomatoes on the balcony. If anyone has tips for keeping pigeons away, I am listening.',
  'Three hours debugging only to find a missing comma. Going for a walk now.',
  'The bakery downstairs started doing cardamom buns and my budget is in trouble.',
  'Reminder that you are allowed to leave a book unfinished. Life is short.',
  'Ran my first 10k this morning. Slow, sweaty and very happy about it.',
  'Is it just me or did this week last about a month?',
  'New desk setup! Moved the monitor to eye level and my neck already thanks me.',
  'Tried making ramen broth from scratch. Twelve hours later: worth it.',
  'The sunset tonight looked like someone spilled orange juice across the river.',
  'Learning to play the cello at 34. My neighbours are being very patient.',
  'Anyone else keep a list of tiny things that made them happy each day? Mine today: a dog in a raincoat.',
  'Spent the afternoon reorganising the bookshelf by colour. Cannot find anything now. Looks great.',
  'Our team shipped the thing! Celebrating with questionable office pizza.',
  'If you see someone struggling with a heavy suitcase on stairs, help them. Today it was me and a stranger saved my day.',
  'Rainy Sunday, soup on the stove, nowhere to be. Perfect.',
  'Took the long way home just to listen to the rest of the album.',
  'Started journaling again. Day 4 and still going, which is a personal record.',
  'The cat has decided my keyboard is the warmest place in the house. Productivity at zero.',
  'Went to a tiny jazz bar last night and the trio played for two hours straight. Magic.',
  'Question for the gardeners: is it too late to plant garlic?',
  'Repainted the kitchen a soft green. It feels like a different flat.',
  'Grandma sent her recipe for apple cake, written in pencil with three crossed-out versions. Treasure.',
  'Commute podcast recommendations? I have run out of everything.',
  'Five minutes of stretching every morning for a month. My back feels ten years younger.',
  'Saw a heron fishing in the canal on the way to work. City wildlife never gets old.',
  'Made a spreadsheet to plan a picnic. No regrets.'
];
const COMMENTS = ['So relatable', 'This made my day', 'Need the recipe!', 'Congrats!', 'Same here honestly', 'Love this',
  'Ha, exactly', 'Where was this?', 'You inspired me to try it', 'Saving this for later', 'Ten out of ten', 'Big if true',
  'Sending good vibes', 'Wait, really?', 'Tell me more', 'Absolutely beautiful'];
const TRENDS = [['Morning runs', '4,210 posts'], ['Balcony gardens', '2,880 posts'], ['Ramen at home', '1,945 posts'], ['Rainy Sunday', '12.4K posts'], ['Jazz bars', '980 posts']];

const ICON = {
  like: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  cmt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  rep: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'
};

function person() {
  const f = pick(FIRST), l = pick(LAST);
  return { name: `${f} ${l}`, handle: (f + l.slice(0, 3) + rint(1, 99)).toLowerCase(), ini: f[0] + l[0], h: rint(0, 359) };
}
function media() {
  const h = rint(0, 359), h2 = (h + rint(40, 140)) % 360;
  return `radial-gradient(circle at ${rint(10, 90)}% ${rint(10, 90)}%, hsl(${h2} 80% 70% / .9), transparent 45%),` +
    `radial-gradient(circle at ${rint(10, 90)}% ${rint(10, 90)}%, hsl(${(h2 + 60) % 360} 70% 60% / .8), transparent 40%),` +
    `linear-gradient(${rint(0, 180)}deg, hsl(${h} 60% 45%), hsl(${h2} 55% 30%))`;
}
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K' : String(n);
function commentHTML(p, text) {
  return `<div class="cmt"><span class="av" style="--h:${p.h}">${esc(p.ini)}</span><div><b>${esc(p.name)}</b><p>${esc(text)}</p></div></div>`;
}
function postHTML(o = {}) {
  const p = o.person || person();
  const likes = o.likes ?? rint(0, 2400), cm = o.comments ?? rint(0, 6), reps = o.reps ?? rint(0, 300);
  const ago = o.ago || pick(['2m', '9m', '24m', '1h', '3h', '5h', '8h', '1d']);
  const cmts = Array.from({ length: Math.min(cm, 4) }, () => commentHTML(person(), pick(COMMENTS))).join('');
  return `<article class="post${o.isNew ? ' new' : ''}" data-cmt="${cm}">
    <div class="ph"><span class="av" style="--h:${p.h}">${esc(p.ini)}</span>

  add('Window has a frame', !outerWidth || !outerHeight ? 'fail' : 'pass', `Outer ${outerWidth}×${outerHeight}, inner ${innerWidth}×${innerHeight}`, 35);
  const s = screen, scrBad = !s.width || s.availWidth > s.width || s.availHeight > s.height, scrDef = s.width === 800 && s.height === 600;
  add('Screen dimensions', scrBad ? 'fail' : scrDef ? 'warn' : 'pass', `${s.width}×${s.height}, available ${s.availWidth}×${s.availHeight}`, 25);

  const tampered = [];
  if (!isNative(Function.prototype.toString)) tampered.push('Function.prototype.toString');
  ['webdriver', 'userAgent', 'platform', 'languages', 'plugins', 'hardwareConcurrency', 'deviceMemory', 'vendor'].forEach(p => { const d = Object.getOwnPropertyDescriptor(Navigator.prototype, p); if (d && d.get && !isNative(d.get)) tampered.push('navigator.' + p); });

  [[HTMLCanvasElement.prototype, 'toDataURL'], [HTMLCanvasElement.prototype, 'getContext'], [window.WebGLRenderingContext && WebGLRenderingContext.prototype, 'getParameter'], [window.Permissions && Permissions.prototype, 'query']]
    .forEach(([o, k]) => { if (o && o[k] && !isNative(o[k])) tampered.push(k); });
  add('Built-ins untouched', tampered.length ? 'fail' : 'pass', tampered.length ? 'Overridden: ' + tampered.join(', ') : 'All native', 35);

  const uaOS = osFrom(ua), pfRaw = navigator.platform || ''; let pfOS = osFrom(pfRaw);
  if (pfOS === 'Linux' && (uaOS === 'Android' || uaOS === 'ChromeOS')) pfOS = uaOS;
  let chOS = null; try { if (navigator.userAgentData?.platform) chOS = osFrom(navigator.userAgentData.platform); } catch {}
  const osBad = (pfOS !== '?' && uaOS !== '?' && pfOS !== uaOS) || (chOS && chOS !== '?' && uaOS !== '?' && chOS !== uaOS);
  add('Operating system agrees', osBad ? 'fail' : 'pass', `UA: ${uaOS}, platform: ${pfRaw || '?'}${chOS ? ', hints: ' + navigator.userAgentData.platform : ''}`, 40);

  const gecko = eval.toString().length === 37 || 'MozAppearance' in document.documentElement.style;
  const engineBad = (firefoxUA && !gecko) || (!firefoxUA && /Chrome|Safari/.test(ua) && gecko);
  const noHints = chromeUA && !/OPR|Edg|SamsungBrowser|YaBrowser/.test(ua) && !navigator.userAgentData && isSecureContext;
  add('Engine matches user agent', engineBad ? 'fail' : noHints ? 'warn' : 'pass', engineBad ? 'Claimed browser and actual engine differ' : noHints ? 'Claims Chrome without client hints' : `Engine: ${gecko ? 'Gecko' : 'Blink/WebKit'}, as claimed`, 40);

  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone, d = new Date(), a = tzOffset(tz, d), b = -d.getTimezoneOffset();
    add('Time zone agrees', a !== b ? 'fail' : 'pass', a !== b ? `${tz} implies ${a / 60}h but the clock says ${b / 60}h` : `${tz}, UTC${b >= 0 ? '+' : ''}${b / 60}`, 30);
  } catch {}
  const hc = navigator.hardwareConcurrency;
  add('CPU cores', !hc || hc < 2 ? 'warn' : 'pass', `${hc ?? 'Unknown'} cores${navigator.deviceMemory ? ', ' + navigator.deviceMemory + ' GB' : ''}`, 12);
  if (/Mobi|Android|iPhone/i.test(ua)) add('Touch on mobile', navigator.maxTouchPoints > 0 ? 'pass' : 'fail', `${navigator.maxTouchPoints} touch points`, 30);
  const c1 = canvasPrint(), c2 = canvasPrint();
  add('Stable canvas drawing', c1 && c1 !== c2 ? 'warn' : 'pass', c1 && c1 !== c2 ? 'Identical drawings differ: a fingerprint randomiser is active' : 'Identical drawings match', 25);
  try {
    const f = document.createElement('iframe'); f.style.display = 'none'; document.body.appendChild(f);
    const n = f.contentWindow.navigator, diffs = [];
    if (n.userAgent !== navigator.userAgent) diffs.push('user agent');
    if (!!n.webdriver !== !!navigator.webdriver) diffs.push('webdriver');
    if ((n.languages || []).join() !== langs.join()) diffs.push('languages');
    if (n.hardwareConcurrency !== navigator.hardwareConcurrency) diffs.push('cores');
    if (n.platform !== navigator.platform) diffs.push('platform');
    f.remove();
    add('Frames agree', diffs.length ? 'fail' : 'pass', diffs.length ? 'Fresh frame differs in ' + diffs.join(', ') : 'Fresh frame matches', 40);
  } catch { add('Frames agree', 'skip', 'Could not create a test frame', 0); }
  const w = await workerNav();
  if (!w) add('Background thread agrees', 'skip', 'Workers unavailable', 0);
  else {
    const diffs = [];
    if (w.ua !== navigator.userAgent) diffs.push('user agent');
    if (w.hc !== navigator.hardwareConcurrency) diffs.push('cores');
    if (w.lang !== langs.join(',')) diffs.push('languages');
    if (w.pf && w.pf !== navigator.platform) diffs.push('platform');
    add('Background thread agrees', diffs.length ? 'fail' : 'pass', diffs.length ? 'Worker differs in ' + diffs.join(', ') : 'Worker matches', 45);
  }

}

/* ===== reCAPTCHA v3 ===== */
const RC = { state: 'idle', ready: false, last: 0, history: [] };
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true; s.defer = true;
    s.onload = res; s.onerror = () => rej(new Error('blocked')); document.head.appendChild(s);
    setTimeout(() => rej(new Error('timeout')), 10000);
  });
}
async function postJSON(path, body) {
  const r = await fetch(CFG.verifyBase + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
async function service(action, force) {
  if (!RC.ready) return;
  const now = Date.now();
  if (!force && now - RC.last < 8000) return;
  RC.last = now;
  try {
    RC.state = 'running';
    const token = await grecaptcha.execute(CFG.recaptchaKey, { action });
    const r = await postJSON('/verify/recaptcha', { token, action });
    RC.history.push({ action, score: r.score, success: r.success, errors: r['error-codes'] || [], at: new Date().toISOString() });
    RC.state = r.success ? 'ok' : 'error';
  } catch (e) { RC.state = 'error'; RC.history.push({ action, success: false, errors: [String(e.message || e)] }); }
}
function initRecaptcha() {
  if (!configured(CFG.recaptchaKey)) { RC.state = 'unconfigured'; return; }
  $('#legal').hidden = false;
  RC.state = 'loading';
  loadScript('https://www.google.com/recaptcha/api.js?render=' + encodeURIComponent(CFG.recaptchaKey))
    .then(() => grecaptcha.ready(() => { RC.ready = true; RC.state = 'ready'; service('page_load', true); }))
    .catch(() => { RC.state = 'blocked'; });
  setInterval(() => { if (document.visibilityState === 'visible') service('heartbeat'); }, 45000);
}
$('#rerun').addEventListener('click', () => {
  if (RC.ready) service('manual_check', true);
  else toast('reCAPTCHA needs self-hosting with your keys');
});
initRecaptcha();

/* ===== Widget ===== */
const WORD = { pass: 'Pass', warn: 'Suspicious', fail: 'Bot signal', pending: 'Waiting', skip: 'Unavailable' };
const score = l => Math.max(0, Math.round(l.reduce((s, c) => s - (c.s === 'fail' ? c.pen : c.s === 'warn' ? c.pen / 3 : 0), 100)));
const tone = n => n == null ? 'tone-none' : n >= 75 ? 'tone-ok' : n >= 45 ? 'tone-warn' : 'tone-bad';
function setRow(id, val, pct, sub, t) {
  const r = $(id);
  r.querySelector('.v').textContent = val;
  r.querySelector('.v').className = 'v ' + t;
  const m = r.querySelector('.meter'); if (m) { m.className = 'meter ' + t; m.firstElementChild.style.width = (pct ?? 0) + '%'; }
  r.querySelector('.sub').textContent = sub;
}
const SVC_MSG = {
  unconfigured: 'Not configured: self-host with your keys to enable',
  blocked: 'Script could not load here (page policy or blocker)',
  loading: 'Loading', ready: 'Ready', running: 'Checking…', idle: 'Starting'
};
let FP = null, BEH = [], tab = null, summary = {};
function render() {
  BEH = behaviourChecks();
  const active = BEH.filter(c => c.s !== 'pending' && c.s !== 'skip').length;
  const beh = active >= 4 ? score(BEH) : null;
  const fp = FP ? score(FP) : null;
  const bf = BEH.filter(c => c.s === 'fail').length, ff = FP ? FP.filter(c => c.s === 'fail').length : 0;
  setRow('#rBeh', beh ?? '–', beh, beh == null ? `Collecting: ${active} of 4 signals` : `${active} signals, ${bf} bot signal${bf === 1 ? '' : 's'}`, tone(beh));
  setRow('#rFp', fp ?? '…', fp, fp == null ? 'Running checks' : `${FP.length} checks, ${ff} inconsistenc${ff === 1 ? 'y' : 'ies'}`, tone(fp));

  const last = [...RC.history].reverse().find(h => typeof h.score === 'number');
  const lastAny = RC.history[RC.history.length - 1];
  const rc = last ? Math.round(last.score * 100) : null;
  let rcSub = SVC_MSG[RC.state] || '';
  if (last) rcSub = `Latest on "${last.action}", ${RC.history.filter(h => typeof h.score === 'number').length} checks`;
  if (lastAny && !lastAny.success && lastAny.errors?.length) rcSub = 'Error: ' + lastAny.errors.join(', ');
  setRow('#rRc', last ? last.score.toFixed(1) : '–', rc, rcSub, tone(rc));

  const parts = [[beh, .35], [fp, .3], [rc, .35]].filter(([v]) => v != null);
  let overall = null;
  if (beh != null && fp != null) {
    const wsum = parts.reduce((s, [, w]) => s + w, 0);
    overall = Math.round(parts.reduce((s, [v, w]) => s + v * w, 0) / wsum);
    const lo = Math.min(...parts.map(([v]) => v));
    if (lo < 35) overall = Math.min(overall, lo + 10);
  }
  const n = $('#scNum'); n.textContent = overall ?? '–'; n.className = 'sc-num ' + tone(overall);
  $('#scVerdict').textContent = overall == null ? (fp != null && fp < 45 ? 'Browser looks automated' : 'Interact with the feed')
    : overall >= 75 ? 'Reads as human' : overall >= 45 ? 'Mixed signals' : 'Reads as automated';
  summary = { overall, behaviour: beh, fingerprint: fp, recaptchaV3: last ? last.score : null };

  const det = $('#detail');
  if (tab) {
    const list = tab === 'beh' ? BEH : (FP || []);
    det.innerHTML = list.map(c => `<li class="chk" data-s="${c.s}"><span class="m"></span><b>${esc(c.name)}</b><span class="s">${WORD[c.s]}</span><p>${esc(c.detail)}</p></li>`).join('');
  }
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
  tab = tab === b.dataset.tab ? null : b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-pressed', x.dataset.tab === tab));
  $('#detail').hidden = !tab; render();
}));
$('#scToggle').addEventListener('click', () => {
  const sc = $('#sc'), min = sc.classList.toggle('min');
  $('#scToggle').setAttribute('aria-expanded', !min);
  $('#scToggle').setAttribute('aria-label', min ? 'Expand session check' : 'Collapse session check');
  $('#scToggle svg').style.transform = min ? 'rotate(180deg)' : '';
});
$('#copyRep').addEventListener('click', async () => {
  const rep = {
    generated: new Date().toISOString(), userAgent: navigator.userAgent, scores: summary,
    behaviour: BEH.map(c => ({ check: c.name, result: WORD[c.s], detail: c.detail })),
    fingerprint: (FP || []).map(c => ({ check: c.name, result: WORD[c.s], detail: c.detail })),
    recaptchaHistory: RC.history
  };
  try { await navigator.clipboard.writeText(JSON.stringify(rep, null, 2)); toast('Report copied'); }
  catch { console.log(rep); toast('Clipboard blocked; report logged to the console'); }
});

fingerprintChecks().then(r => { FP = r; render(); });
setInterval(render, 500);
render();

/* Speed sparkline */
const spark = $('#spark');
let col = '', colAt = 0;
function draw(now) {
  if (!$('#sc').classList.contains('min')) {
    if (now - colAt > 1000) { col = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); colAt = now; }
    const dpr = devicePixelRatio || 1, W = Math.round(spark.clientWidth * dpr), H = Math.round(spark.clientHeight * dpr);
    if (spark.width !== W || spark.height !== H) { spark.width = W; spark.height = H; }
    const x = spark.getContext('2d'), WIN = 6000, t0 = now - WIN;
    x.clearRect(0, 0, W, H);
    while (D.trace.length && D.trace[0].t < t0 - 300) D.trace.shift();
    const y = v => H - 3 * dpr - Math.min(1, Math.sqrt(v / 8)) * (H - 6 * dpr);
    x.strokeStyle = col; x.lineWidth = 1.5 * dpr; x.lineJoin = 'round'; x.beginPath();
    let prev = null;
    for (const p of D.trace) {
      const px = (p.t - t0) / WIN * W;
      if (!prev || p.t - prev.t > 150) { if (prev) x.lineTo((prev.t + 60 - t0) / WIN * W, y(0)); x.moveTo(px, y(0)); }
      x.lineTo(px, y(p.v)); prev = p;
    }
    x.lineTo(prev ? Math.min(W, (Math.min(now, prev.t + 60) - t0) / WIN * W) : 0, y(0));
    x.lineTo(W, y(0));
    x.stroke();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
